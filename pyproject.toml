[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "superstore-analytics"
version = "1.0.0"
description = "Advanced Python Data Exploration, Memory Optimization, and Automated KPI Reporting Pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Superstore Analytics Team" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "xlrd>=2.0.1",
    "openpyxl>=3.1.0",
    "scipy>=1.10.0",
    "tabulate>=0.9.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.20.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
